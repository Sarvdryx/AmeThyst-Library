name: amethyst_ecosystem

services:
  # ============================================================================
  # PostgreSQL + pgvector
  # ============================================================================
  db:
    image: pgvector/pgvector:pg15
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init_db/postgres:/docker-entrypoint-initdb.d
      

  # ============================================================================
  # GRAPH KNOWLEDGE ENGINE
  # ============================================================================
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: amethyst_memgraph
    restart: always
    ports:
      - "127.0.0.1:7687:7687"
    environment:
      MEMGRAPH_USER: ${MEMGRAPH_USER}
      MEMGRAPH_PASSWORD: ${MEMGRAPH_PASSWORD}
    volumes:
      - memgraph_data:/var/lib/memgraph
      - ./init_db/memgraph/init_graph.cypherl:/etc/memgraph/init_graph.cypherl
    command: ["--init-data-file=/etc/memgraph/init_graph.cypherl"]
  # ============================================================================
  # VISUAL LAB 
  # ============================================================================
  lab:
    image: memgraph/lab:latest
    container_name: amethyst_memgraph_lab
    restart: always
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      - QUICK_CONNECT_MG_HOST=memgraph
      # 🟩 Supply authentication credentials to enable visual lab instant auto-login
      - QUICK_CONNECT_MG_PORT=7687
      - QUICK_CONNECT_MG_USER=${MEMGRAPH_USER}
      - QUICK_CONNECT_MG_PASSWORD=${MEMGRAPH_PASSWORD}
    depends_on:
      - memgraph

volumes:
  pgdata:
    driver: local
  memgraph_data:
    driver: local
