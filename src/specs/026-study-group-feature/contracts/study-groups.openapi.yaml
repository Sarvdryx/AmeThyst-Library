openapi: 3.1.0
info:
  title: AmeThyst Study Groups API
  version: 1.0.0
  description: Contract for reservation-backed Study Group creation, discovery, dashboards, participation, host management, and dissolution.
servers:
  - url: http://localhost:5000
tags:
  - name: Study Groups
  - name: Participation
security:
  - bearerAuth: []

paths:
  /api/study-groups:
    post:
      tags: [Study Groups]
      summary: Atomically create a reservation and its Study Group
      operationId: createStudyGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudyGroupInput'
      responses:
        '201':
          description: Reservation and Study Group committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupDetailResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }
    get:
      tags: [Study Groups]
      security:
        - {}
        - bearerAuth: []
      summary: Discover persisted Upcoming Study Groups
      operationId: listStudyGroups
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: search
          in: query
          schema: { type: string, maxLength: 100 }
        - name: subject
          in: query
          schema: { type: string, maxLength: 30 }
        - name: date
          in: query
          schema: { type: string, format: date }
        - name: startTime
          in: query
          schema: { type: string, format: time }
        - name: endTime
          in: query
          schema: { type: string, format: time }
        - name: branchIds
          in: query
          description: Comma-separated persisted branch identifiers
          schema: { type: string, pattern: '^\\d+(,\\d+)*$' }
        - name: roomIds
          in: query
          description: Comma-separated persisted room identifiers with capacity of at least one
          schema: { type: string, pattern: '^\\d+(,\\d+)*$' }
      responses:
        '200':
          description: Filtered Upcoming groups; authenticated results exclude hosted and Approved groups before pagination, then order Pending requests first and nearest scheduled start first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupPageResponse'
        '400': { $ref: '#/components/responses/ValidationError' }

  /api/study-groups/created:
    get:
      tags: [Study Groups]
      summary: List groups hosted by the current user
      operationId: listCreatedStudyGroups
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Groups ordered In Progress, Full, Upcoming, Completed, Expired; dissolved groups are deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupPageResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/study-groups/joined:
    get:
      tags: [Participation]
      summary: List current user's Approved, Pending, and Denied participation
      operationId: listJoinedStudyGroups
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Participation ordered Approved, Pending, Denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinedStudyGroupPageResponse'
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/study-groups/{groupId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    get:
      tags: [Study Groups]
      security:
        - {}
        - bearerAuth: []
      summary: Get Study Group details
      operationId: getStudyGroup
      responses:
        '200':
          description: Group detail; host receives management members/requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupDetailResponse'
        '404': { $ref: '#/components/responses/NotFoundError' }
    patch:
      tags: [Study Groups]
      summary: Edit host-managed group metadata
      operationId: updateStudyGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStudyGroupInput'
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudyGroupDetailResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/requests:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Participation]
      summary: Submit a real request to join
      operationId: requestToJoin
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                content:
                  type: string
                  maxLength: 100
      responses:
        '201':
          description: Pending request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationResponse'
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    delete:
      tags: [Participation]
      summary: Cancel the current participant's Pending request
      operationId: cancelJoinRequest
      responses:
        '200':
          description: Pending request removed from participant and host queues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessageResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/requests/{requestId}/approve:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Participation]
      summary: Approve a Pending request as host
      operationId: approveJoinRequest
      responses:
        '200':
          description: Request approved and count/status reconciled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipationMutationResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/requests/{requestId}/deny:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Participation]
      summary: Deny a Pending request as host
      operationId: denyJoinRequest
      responses:
        '200':
          description: Request denied with authoritative decision time
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipationMutationResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Participation]
      summary: Remove an Approved member as host
      operationId: removeStudyGroupMember
      responses:
        '200':
          description: Membership removed and count/status reconciled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyGroupSummaryResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/membership:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    delete:
      tags: [Participation]
      summary: Leave an Approved future group
      description: Available only while at least three hours remain before the reservation start instant calculated in Vietnam time; the exact three-hour boundary is allowed. On success the creator is notified by email and, when connected, through the existing targeted bell channel.
      operationId: leaveStudyGroup
      responses:
        '200':
          description: Current user's membership removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuccessMessageResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/dissolve:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Study Groups]
      summary: Permanently delete the reservation, linked group, and participation rows
      description: Available to the host of an Upcoming or Full group only when at least three hours remain before its reservation start instant in Vietnam time; the exact three-hour boundary is allowed.
      operationId: dissolveStudyGroup
      responses:
        '200':
          description: Reservation permanently deleted; linked group and participation rows removed atomically by cascade
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyGroupDetailResponse' }
        '401': { $ref: '#/components/responses/UnauthorizedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/invitations:
    get:
      tags: [Participation]
      summary: List the current user's Pending Study Group invitations
      operationId: listStudyGroupInvitations
      responses:
        '200': { description: Pending invitations newest first, each including the creator actor snapshot with user ID, username, email, and nullable avatar for notification detail }
        '401': { $ref: '#/components/responses/UnauthorizedError' }

  /api/study-groups/{groupId}/invitations:
    parameters:
      - $ref: '#/components/parameters/GroupId'
    post:
      tags: [Participation]
      summary: Invite an existing AmeThyst user by email
      operationId: inviteStudyGroupMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                message: { type: string, maxLength: 100 }
      responses:
        '201': { description: Pending invite persisted and email delivered with creator username, email, and optional avatar in the message }
        '400': { $ref: '#/components/responses/ValidationError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/invitations/{requestId}/accept:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Participation]
      summary: Accept an invitation as its recipient
      operationId: acceptStudyGroupInvitation
      responses:
        '200': { description: Invitation approved and capacity incremented exactly once }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /api/study-groups/{groupId}/invitations/{requestId}/deny:
    parameters:
      - $ref: '#/components/parameters/GroupId'
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Participation]
      summary: Deny an invitation as its recipient without join cooldown
      operationId: denyStudyGroupInvitation
      responses:
        '200': { description: Invitation denied; member count unchanged }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    GroupId:
      name: groupId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RequestId:
      name: requestId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 8 }

  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    UnauthorizedError:
      description: Missing or invalid authentication
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ForbiddenError:
      description: Authenticated user is not allowed to perform the action
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFoundError:
      description: Resource not found or inaccessible
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ConflictError:
      description: Slot, capacity, cooldown, duplicate, lifecycle, or stale-state conflict
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    CreateStudyGroupInput:
      type: object
      additionalProperties: false
      required: [availId, startDate, title, description, subject, requirements]
      properties:
        availId: { type: integer, minimum: 1 }
        startDate: { type: string, format: date }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1, maxLength: 30 }
        requirements:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, minLength: 1 }

    UpdateStudyGroupInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        subject: { type: string, minLength: 1, maxLength: 30 }
        requirements:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string, minLength: 1 }

    GroupStatus:
      type: string
      enum: [upcoming, full, inprogress, completed, cancelled, expired]
    ParticipationStatus:
      type: string
      enum: [pending, approved, denied, expired]

    ReservationSummary:
      type: object
      required: [reserveId, startDate, startTime, endTime, status, room]
      properties:
        reserveId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        startTime: { type: string }
        endTime: { type: string }
        status: { type: string, enum: [pending, reserved, used] }
        room:
          $ref: '#/components/schemas/RoomSummary'

    RoomSummary:
      type: object
      required: [roomId, roomName, branchId, branchName, capacity]
      properties:
        roomId: { type: integer }
        roomName: { type: string }
        branchId: { type: integer }
        branchName: { type: string }
        capacity: { type: integer, minimum: 1 }
        imageUrl: { type: [string, 'null'] }

    UserSummary:
      type: object
      required: [userId, username]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        avatar: { type: [string, 'null'] }
        role: { type: [string, 'null'], description: Role label shown in the detail-popup profile preview }
        email: { type: [string, 'null'], description: Returned for organizer and Approved-member profile previews in detail responses only }
        phoneNumber: { type: [string, 'null'], description: Detail-only profile preview field }
        birthDate: { type: [string, 'null'], format: date, description: Detail-only profile preview field }
        gender: { type: [string, 'null'], enum: [male, female, other, null], description: Detail-only profile preview field }
        occupation: { type: [string, 'null'] }
        hometown: { type: [string, 'null'] }
        description: { type: [string, 'null'], description: Short public profile description }

    Participation:
      type: object
      required: [requestId, groupId, user, status, createdAt]
      properties:
        requestId: { type: string, format: uuid }
        groupId: { type: string, format: uuid }
        user: { $ref: '#/components/schemas/UserSummary' }
        content: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ParticipationStatus' }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }

    StudyGroupSummary:
      type: object
      required: [groupId, subject, title, description, requirements, host, reservation, capacity, currentMembers, status, canJoin]
      properties:
        groupId: { type: string, format: uuid }
        subject: { type: string }
        title: { type: string }
        description: { type: string }
        requirements:
          type: array
          minItems: 1
          maxItems: 5
          items: { type: string }
        host: { $ref: '#/components/schemas/UserSummary' }
        reservation: { $ref: '#/components/schemas/ReservationSummary' }
        capacity: { type: integer, minimum: 1 }
        currentMembers: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/GroupStatus' }
        pendingCount: { type: integer, minimum: 0, default: 0 }
        currentUserParticipation:
          anyOf:
            - $ref: '#/components/schemas/Participation'
            - type: 'null'
        canJoin: { type: boolean }
        retryAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StudyGroupDetail:
      allOf:
        - $ref: '#/components/schemas/StudyGroupSummary'
        - type: object
          properties:
            approvedMembers:
              type: array
              items: { $ref: '#/components/schemas/Participation' }
            organizerProfile:
              $ref: '#/components/schemas/UserSummary'
            pendingRequests:
              type: array
              items: { $ref: '#/components/schemas/Participation' }
            permissions:
              type: object
              required: [canEdit, canApprove, canDeny, canRemove, canDissolve, canLeave, canCancelRequest]
              properties:
                canEdit: { type: boolean }
                canApprove: { type: boolean }
                canDeny: { type: boolean }
                canRemove: { type: boolean }
                canDissolve: { type: boolean }
                canLeave: { type: boolean }
                canCancelRequest: { type: boolean }

    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }

    JoinedStudyGroup:
      type: object
      required: [group, participation]
      properties:
        group: { $ref: '#/components/schemas/StudyGroupSummary' }
        participation: { $ref: '#/components/schemas/Participation' }

    StudyGroupDetailResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/StudyGroupDetail' }
    StudyGroupSummaryResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/StudyGroupSummary' }
    StudyGroupPageResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/StudyGroupSummary' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    JoinedStudyGroupPageResponse:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, const: true }
        data:
          type: array
          items: { $ref: '#/components/schemas/JoinedStudyGroup' }
        meta: { $ref: '#/components/schemas/PageMeta' }
    ParticipationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data: { $ref: '#/components/schemas/Participation' }
    ParticipationMutationResponse:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, const: true }
        data:
          type: object
          required: [group, participation]
          properties:
            group: { $ref: '#/components/schemas/StudyGroupSummary' }
            participation: { $ref: '#/components/schemas/Participation' }
    SuccessMessageResponse:
      type: object
      required: [success, message]
      properties:
        success: { type: boolean, const: true }
        message: { type: string }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR, FORBIDDEN, NOT_FOUND, SLOT_UNAVAILABLE, GROUP_FULL, COOLDOWN_ACTIVE, LEAVE_CUTOFF, DISSOLVE_CUTOFF, STALE_STATE]
            message: { type: string }
            details: { type: object, additionalProperties: true }
            retryAt: { type: [string, 'null'], format: date-time }
